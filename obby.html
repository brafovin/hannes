<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OBBY!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 500;

let gameState = 'start';
let lives = 3;
let timer = 0;
let timerRunning = false;
let timerStarted = false;
let cameraX = 0;
let currentSection = 'Start Area';
let sectionAnnounce = { text: '', alpha: 0, timer: 0 };
let clouds = [];
let particles = [];
let keys = {};
let platforms = [];
let spikes = [];
let lavaRects = [];

const PLAYER_W = 32, PLAYER_H = 32;
let player = {
  x: 100, y: 400, w: PLAYER_W, h: PLAYER_H,
  vx: 0, vy: 0,
  onGround: false, jumpsLeft: 2, coyoteTime: 0, jumpHeld: 0,
  dead: false, deathTimer: 0, deathScale: 1,
  color: '#4a90d9',
  checkpointX: 100, checkpointY: 400,
  facingRight: true
};

let checkpoints = [
  { x: 1400, y: 380, reached: false },
  { x: 2700, y: 300, reached: false },
  { x: 4050, y: 340, reached: false },
  { x: 5250, y: 330, reached: false },
  { x: 6450, y: 380, reached: false },
];

let finishFlag = { x: 7900, y: 220 };

function addGround(sx, w) {
  platforms.push({ x: sx, y: 452, w: w, h: 48, color: '#8B4513', type: 'static', isGround: true });
  platforms.push({ x: sx, y: 452, w: w, h: 10, color: '#27ae60', type: 'static', isGround: true });
}
function addPlat(x, y, w, h, color) {
  platforms.push({ x, y, w, h, color, type: 'static' });
}
function addMovePlat(x, y, w, h, color, mx, mspeed) {
  platforms.push({ x, y, w, h, color, type: 'move', _ox: x, mx, mspeed, _t: Math.random() * Math.PI * 2, vx: 0 });
}
function addGhostPlat(x, y, w, h, color, showMs, hideMs) {
  platforms.push({ x, y, w, h, color, type: 'ghost', gVisible: true, gTimer: 0, showMs, hideMs, gState: 'show' });
}
function addSpikes(x, y, count, dir) {
  for (let i = 0; i < count; i++) {
    spikes.push({ x: x + i * 20, y: dir === 'up' ? y - 20 : y, w: 20, h: 20, dir });
  }
}

function buildLevel() {
  platforms = []; spikes = []; lavaRects = [];

  // Ground
  addGround(0, 5000);
  lavaRects.push({ x: 5200, y: 440, w: 1350, h: 60 });
  addGround(6550, 1600);

  // START 0-1500
  addPlat(300, 360, 120, 16, '#5cb85c');
  addPlat(500, 320, 100, 16, '#f0ad4e');
  addPlat(680, 280, 130, 16, '#5cb85c');
  addPlat(870, 320, 100, 16, '#d9534f');
  addPlat(1020, 360, 110, 16, '#5bc0de');
  addPlat(1180, 310, 120, 16, '#f0ad4e');
  addPlat(1350, 270, 140, 16, '#5cb85c');
  addPlat(1500, 300, 100, 16, '#9b59b6');

  // SECTION 1: MOVING PLATFORMS 1500-2800
  addMovePlat(1600, 360, 100, 16, '#e74c3c', 80, 1.5);
  addMovePlat(1780, 320, 90, 16, '#3498db', 100, 2.0);
  addMovePlat(1960, 290, 100, 16, '#2ecc71', 90, 1.8);
  addMovePlat(2130, 260, 85, 16, '#e74c3c', 110, 2.2);
  addMovePlat(2280, 300, 90, 16, '#9b59b6', 100, 1.7);
  addMovePlat(2430, 270, 95, 16, '#f39c12', 80, 2.0);
  addMovePlat(2580, 300, 90, 16, '#1abc9c', 110, 2.5);
  addMovePlat(2720, 330, 85, 16, '#e74c3c', 90, 1.9);

  // SECTION 2: SPIKES 2800-4000
  addPlat(2850, 360, 140, 16, '#c0392b');
  addPlat(3050, 340, 110, 16, '#c0392b');
  addPlat(3220, 310, 130, 16, '#c0392b');
  addPlat(3410, 280, 100, 16, '#c0392b');
  addPlat(3580, 310, 120, 16, '#c0392b');
  addPlat(3760, 350, 100, 16, '#c0392b');
  addPlat(3910, 360, 140, 16, '#c0392b');

  addSpikes(2820, 452, 3, 'up');
  addSpikes(2980, 452, 3, 'up');
  addSpikes(3170, 452, 4, 'up');
  addSpikes(3360, 452, 3, 'up');
  addSpikes(3530, 452, 3, 'up');
  addSpikes(3700, 452, 2, 'up');
  addSpikes(3870, 452, 3, 'up');

  addSpikes(2860, 344, 2, 'up');
  addSpikes(3230, 294, 2, 'up');
  addSpikes(3590, 294, 2, 'up');

  addSpikes(2920, 200, 3, 'down');
  addSpikes(3120, 180, 3, 'down');
  addSpikes(3320, 190, 3, 'down');
  addSpikes(3520, 180, 3, 'down');
  addSpikes(3720, 195, 2, 'down');

  // SECTION 3: GHOST 4000-5200
  addGhostPlat(4060, 380, 120, 16, '#8e44ad', 3000, 1500);
  addGhostPlat(4240, 340, 100, 16, '#2980b9', 2800, 2000);
  addGhostPlat(4410, 300, 110, 16, '#8e44ad', 3200, 1800);
  addGhostPlat(4580, 260, 95, 16, '#2980b9', 2500, 2200);
  addGhostPlat(4740, 290, 110, 16, '#8e44ad', 3000, 1600);
  addGhostPlat(4910, 320, 100, 16, '#2980b9', 2800, 2000);
  addGhostPlat(5060, 300, 120, 16, '#8e44ad', 2600, 1900);
  addPlat(5160, 350, 100, 16, '#27ae60');

  // SECTION 4: LAVA 5200-6500
  addPlat(5270, 360, 100, 16, '#e67e22');
  addPlat(5430, 320, 90, 16, '#e67e22');
  addPlat(5580, 280, 100, 16, '#e67e22');
  addMovePlat(5730, 300, 90, 16, '#d35400', 80, 1.8);
  addPlat(5880, 260, 100, 16, '#e67e22');
  addMovePlat(6030, 300, 85, 16, '#d35400', 100, 2.0);
  addPlat(6170, 340, 90, 16, '#e67e22');
  addMovePlat(6320, 300, 85, 16, '#d35400', 80, 2.2);
  addPlat(6460, 360, 140, 16, '#e67e22');

  // SECTION 5: FINAL 6500-8000
  addMovePlat(6610, 340, 85, 16, '#e74c3c', 80, 2.5);
  addSpikes(6630, 452, 3, 'up');
  addGhostPlat(6770, 300, 90, 16, '#8e44ad', 2500, 1800);
  addMovePlat(6920, 260, 85, 16, '#3498db', 100, 2.2);
  addSpikes(6940, 250, 2, 'down');
  addGhostPlat(7080, 280, 90, 16, '#8e44ad', 2200, 2000);
  addPlat(7220, 300, 100, 16, '#2ecc71');
  addSpikes(7230, 290, 2, 'up');
  addMovePlat(7390, 260, 85, 16, '#e74c3c', 90, 2.8);
  addGhostPlat(7540, 240, 90, 16, '#8e44ad', 2000, 2200);
  addPlat(7700, 260, 100, 16, '#2ecc71');
  addMovePlat(7840, 250, 85, 16, '#f39c12', 80, 2.0);
  addPlat(7960, 300, 200, 16, '#27ae60');
}

function initClouds() {
  clouds = [];
  for (let i = 0; i < 22; i++) {
    clouds.push({
      x: Math.random() * 9000,
      y: 30 + Math.random() * 160,
      w: 80 + Math.random() * 120,
      h: 35 + Math.random() * 30,
      speed: 0.15 + Math.random() * 0.3
    });
  }
}

const SECTIONS = [
  { x: 0, name: 'Start Area' },
  { x: 1500, name: 'Classic Platforms' },
  { x: 2800, name: 'Spike Zone' },
  { x: 4000, name: 'Ghost Platforms' },
  { x: 5200, name: 'Lava Crossing' },
  { x: 6500, name: 'The Final Stretch' },
];

function getSectionName(px) {
  let name = 'Start Area';
  for (let s of SECTIONS) { if (px >= s.x) name = s.name; }
  return name;
}

document.addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  const prev = keys[e.code];
  keys[e.code] = true;
  if (gameState === 'start' && e.code === 'Space') { startGame(); return; }
  if ((gameState === 'win' || gameState === 'gameover') && e.code === 'KeyR') { startGame(); return; }
  if (gameState === 'playing' && !player.dead && !prev) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') doJump();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function doJump() {
  if (!timerStarted) { timerStarted = true; timerRunning = true; }
  if (player.onGround || player.coyoteTime > 0) {
    player.vy = -10.5;
    player.jumpHeld = 1;
    player.onGround = false;
    player.coyoteTime = 0;
    player.jumpsLeft = 1;
  } else if (player.jumpsLeft > 0) {
    player.vy = -9.5;
    player.jumpHeld = 1;
    player.jumpsLeft = 0;
  }
}

function startGame() {
  lives = 3; timer = 0; timerRunning = false; timerStarted = false;
  gameState = 'playing'; currentSection = 'Start Area';
  sectionAnnounce = { text: '', alpha: 0, timer: 0 };
  particles = [];
  buildLevel(); initClouds();
  resetPlayer(100, 400);
  checkpoints.forEach(c => c.reached = false);
  player.checkpointX = 100; player.checkpointY = 400;
  cameraX = 0;
}

function resetPlayer(x, y) {
  player.x = x; player.y = y;
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.jumpsLeft = 2; player.coyoteTime = 0; player.jumpHeld = 0;
  player.dead = false; player.deathTimer = 0; player.deathScale = 1;
  player.color = '#4a90d9'; player.facingRight = true;
}

function killPlayer() {
  if (player.dead) return;
  player.dead = true; player.deathTimer = 0; player.vy = -7;
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 12);
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    let a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2, color, life: 0.8 + Math.random()*0.6, r: 3 + Math.random()*4 });
  }
}

let lastTime = 0;
function update(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  requestAnimationFrame(update);

  if (gameState !== 'playing') { draw(); return; }

  if (timerRunning) timer += dt;

  for (let c of clouds) {
    c.x -= c.speed;
    if (c.x + c.w < cameraX - 200) c.x = cameraX + canvas.width + Math.random() * 300;
  }

  if (sectionAnnounce.timer > 0) {
    sectionAnnounce.timer -= dt;
    if (sectionAnnounce.timer > 1.5) sectionAnnounce.alpha = Math.min(1, (3 - sectionAnnounce.timer) * 2);
    else sectionAnnounce.alpha = Math.max(0, sectionAnnounce.timer / 1.5);
  }

  for (let p of platforms) {
    if (p.type === 'move') {
      let prevX = p.x;
      p._t += dt;
      p.x = p._ox + Math.sin(p._t * p.mspeed) * p.mx;
      p.vx = p.x - prevX;
    }
    if (p.type === 'ghost') {
      p.gTimer += dt * 1000;
      if (p.gState === 'show' && p.gTimer >= p.showMs - 500) { p.gState = 'flash'; }
      if (p.gState === 'flash' && p.gTimer >= p.showMs) { p.gState = 'hide'; p.gVisible = false; p.gTimer = 0; }
      if (p.gState === 'hide' && p.gTimer >= p.hideMs) { p.gState = 'show'; p.gVisible = true; p.gTimer = 0; }
    }
  }

  if (player.dead) {
    player.deathTimer += dt;
    player.deathScale = Math.max(0, 1 - player.deathTimer * 2.2);
    player.color = `hsl(${(player.deathTimer * 600) % 360}, 90%, 55%)`;
    if (player.deathTimer > 1.2) {
      lives--;
      if (lives <= 0) { gameState = 'gameover'; }
      else { resetPlayer(player.checkpointX, player.checkpointY - 60); timerRunning = true; }
    }
    draw(); return;
  }

  const moveSpeed = 5.2;
  let moving = false;
  if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -moveSpeed; moving = true; player.facingRight = false; }
  else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = moveSpeed; moving = true; player.facingRight = true; }
  else { player.vx *= 0.72; }

  if (moving && !timerStarted) { timerStarted = true; timerRunning = true; }

  if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.jumpHeld > 0 && player.jumpHeld < 14) {
    player.vy -= 0.65; player.jumpHeld++;
  } else if (!(keys['Space'] || keys['ArrowUp'] || keys['KeyW'])) {
    player.jumpHeld = 0;
  }

  player.vy += 0.52;
  if (player.vy > 16) player.vy = 16;

  if (player.onGround) player.coyoteTime = 0.1;
  else if (player.coyoteTime > 0) player.coyoteTime -= dt;

  player.onGround = false;

  // Move X + collide
  player.x += player.vx;
  for (let p of platforms) {
    if (p.type === 'ghost' && !p.gVisible) continue;
    if (rectsOverlap(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // Move Y + collide
  player.y += player.vy;
  for (let p of platforms) {
    if (p.type === 'ghost' && !p.gVisible) continue;
    if (rectsOverlap(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.jumpsLeft = 2;
        if (p.type === 'move') player.x += p.vx;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0; player.jumpHeld = 0;
      }
    }
  }

  // Spike collision (shrunk hitbox)
  for (let s of spikes) {
    if (player.x + player.w - 5 > s.x + 4 && player.x + 5 < s.x + s.w - 4 &&
        player.y + player.h - 5 > s.y + 4 && player.y + 5 < s.y + s.h - 4) {
      killPlayer();
    }
  }

  // Lava
  for (let l of lavaRects) {
    if (player.x + player.w > l.x && player.x < l.x + l.w &&
        player.y + player.h > l.y && player.y < l.y + l.h) killPlayer();
  }

  if (player.y > 520) killPlayer();
  if (player.x < 0) player.x = 0;

  // Checkpoints
  for (let cp of checkpoints) {
    if (!cp.reached && Math.abs((player.x + player.w/2) - (cp.x + 15)) < 50 && player.y < cp.y + 20) {
      cp.reached = true;
      player.checkpointX = cp.x; player.checkpointY = cp.y;
      spawnParticles(cp.x + 15, cp.y, '#FFD700', 16);
    }
  }

  let newSec = getSectionName(player.x);
  if (newSec !== currentSection) {
    currentSection = newSec;
    sectionAnnounce.text = newSec;
    sectionAnnounce.timer = 3; sectionAnnounce.alpha = 0;
  }

  // Finish
  if (player.x + player.w > finishFlag.x && player.x < finishFlag.x + 60 &&
      player.y + player.h > finishFlag.y - 100 && player.y < finishFlag.y + 120) {
    timerRunning = false; gameState = 'win';
    for (let i = 0; i < 60; i++) spawnParticles(Math.random()*800, Math.random()*300, ['#FFD700','#e74c3c','#2ecc71','#3498db','#9b59b6'][Math.floor(Math.random()*5)], 1);
  }

  let targetCX = player.x - canvas.width/2 + player.w/2;
  cameraX += (targetCX - cameraX) * 0.12;
  if (cameraX < 0) cameraX = 0;

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  draw();
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function draw() {
  let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#87CEEB'); grad.addColorStop(1, '#D0EFFF');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-Math.round(cameraX), 0);

  // Clouds
  for (let c of clouds) {
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath(); ctx.ellipse(c.x + c.w/2, c.y + c.h/2, c.w/2, c.h/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x + c.w*0.28, c.y + c.h*0.3, c.w*0.3, c.h*0.38, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x + c.w*0.72, c.y + c.h*0.3, c.w*0.25, c.h*0.33, 0, 0, Math.PI*2); ctx.fill();
  }

  // Lava
  let t = Date.now() / 600;
  for (let l of lavaRects) {
    let lg = ctx.createLinearGradient(0, l.y, 0, l.y + l.h);
    lg.addColorStop(0, '#FF6600'); lg.addColorStop(0.5, '#FF2200'); lg.addColorStop(1, '#990000');
    ctx.fillStyle = lg; ctx.fillRect(l.x, l.y, l.w, l.h);
    for (let i = 0; i < l.w; i += 36) {
      let bub = Math.sin(t + i * 0.13) * 7;
      ctx.fillStyle = 'rgba(255,210,0,0.55)';
      ctx.beginPath(); ctx.ellipse(l.x + i + 18, l.y + 12 + bub, 11, 7, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  // Platforms
  for (let p of platforms) {
    let alpha = 1;
    if (p.type === 'ghost') {
      if (!p.gVisible) continue;
      if (p.gState === 'flash') alpha = 0.35 + Math.abs(Math.sin(Date.now() / 90)) * 0.65;
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.fillRect(p.x+3, p.y+3, p.w, p.h);
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
    if (!p.isGround) {
      ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(p.x, p.y, p.w, 4);
      ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(p.x, p.y+p.h-4, p.w, 4);
    }
    ctx.globalAlpha = 1;
  }

  // Spikes
  for (let s of spikes) {
    ctx.fillStyle = '#999';
    ctx.beginPath();
    if (s.dir === 'up') { ctx.moveTo(s.x,s.y+s.h); ctx.lineTo(s.x+s.w/2,s.y); ctx.lineTo(s.x+s.w,s.y+s.h); }
    else { ctx.moveTo(s.x,s.y); ctx.lineTo(s.x+s.w/2,s.y+s.h); ctx.lineTo(s.x+s.w,s.y); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ccc';
    ctx.beginPath();
    if (s.dir === 'up') { ctx.moveTo(s.x+3,s.y+s.h); ctx.lineTo(s.x+s.w/2,s.y+4); ctx.lineTo(s.x+s.w/2+4,s.y+s.h); }
    else { ctx.moveTo(s.x+3,s.y); ctx.lineTo(s.x+s.w/2,s.y+s.h-4); ctx.lineTo(s.x+s.w/2+4,s.y); }
    ctx.closePath(); ctx.fill();
  }

  // Checkpoints
  for (let cp of checkpoints) {
    ctx.fillStyle = '#777'; ctx.fillRect(cp.x+12, cp.y-70, 4, 88);
    ctx.fillStyle = cp.reached ? '#FFD700' : '#ddd';
    ctx.beginPath(); ctx.moveTo(cp.x+16,cp.y-70); ctx.lineTo(cp.x+42,cp.y-58); ctx.lineTo(cp.x+16,cp.y-46); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#555'; ctx.fillRect(cp.x+4, cp.y, 24, 8);
    if (cp.reached) {
      ctx.fillStyle = 'rgba(255,215,0,0.3)'; ctx.beginPath(); ctx.arc(cp.x+16, cp.y-30, 25, 0, Math.PI*2); ctx.fill();
    }
  }

  // Finish flag
  ctx.fillStyle = '#777'; ctx.fillRect(finishFlag.x+12, finishFlag.y-90, 4, 110);
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.moveTo(finishFlag.x+16,finishFlag.y-90); ctx.lineTo(finishFlag.x+56,finishFlag.y-72); ctx.lineTo(finishFlag.x+16,finishFlag.y-54); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
  ctx.shadowColor='#000'; ctx.shadowBlur=4;
  ctx.fillText('FINISH', finishFlag.x+16, finishFlag.y+20);
  ctx.shadowBlur=0;

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Player
  if (!player.dead || player.deathScale > 0.02) {
    let cx = player.x + player.w/2, cy = player.y + player.h/2, sc = player.deathScale;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(-player.w/2+4, player.h/2-2, player.w-8, 6);
    ctx.fillStyle = player.color; ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);
    ctx.fillStyle='rgba(255,255,255,0.28)'; ctx.fillRect(-player.w/2,-player.h/2,player.w,6); ctx.fillRect(-player.w/2,-player.h/2,6,player.h);
    let eo = player.facingRight ? 1 : -1;
    ctx.fillStyle='#fff'; ctx.fillRect(-11+eo,-10,8,8); ctx.fillRect(3+eo,-10,8,8);
    ctx.fillStyle='#111';
    ctx.fillRect(-9+eo,-8,4,4); ctx.fillRect(5+eo,-8,4,4);
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1.5; ctx.strokeRect(-player.w/2,-player.h/2,player.w,player.h);
    ctx.restore();
  }

  ctx.restore();

  if (gameState === 'playing') drawHUD();

  if (sectionAnnounce.timer > 0 && sectionAnnounce.alpha > 0.02) {
    ctx.save(); ctx.globalAlpha = sectionAnnounce.alpha;
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0, canvas.height/2-44, canvas.width, 74);
    ctx.fillStyle='#FFD700'; ctx.font='bold 38px Arial'; ctx.textAlign='center';
    ctx.shadowColor='#000'; ctx.shadowBlur=10;
    ctx.fillText(sectionAnnounce.text, canvas.width/2, canvas.height/2+8);
    ctx.restore();
  }

  if (gameState === 'start') drawStartScreen();
  else if (gameState === 'win') drawWinScreen();
  else if (gameState === 'gameover') drawGameOverScreen();
}

function drawHUD() {
  ctx.save();
  ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
  ctx.font = 'bold 18px Arial'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText('Lives:', 10, 30);
  for (let i = 0; i < 3; i++) {
    ctx.font = '26px Arial'; ctx.fillStyle = i < lives ? '#e74c3c' : '#444';
    ctx.fillText('♥', 70 + i*30, 33);
  }
  ctx.font = 'bold 18px Arial'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.fillText('Time: ' + timer.toFixed(2) + 's', canvas.width/2, 28);
  ctx.font = '14px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.textAlign = 'right';
  ctx.fillText(currentSection, canvas.width-10, 28);
  ctx.restore();
}

function drawStartScreen() {
  ctx.fillStyle = 'rgba(0,0,20,0.78)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 12;
  ctx.font = 'bold 100px Arial'; ctx.fillStyle = '#FFD700';
  ctx.fillText('OBBY!', canvas.width/2, 155);
  ctx.strokeStyle = '#ff6600'; ctx.lineWidth = 3;
  ctx.strokeText('OBBY!', canvas.width/2, 155);
  ctx.font = 'bold 20px Arial'; ctx.fillStyle = '#fff';
  ctx.fillText('An Obstacle Course Adventure', canvas.width/2, 200);
  ctx.font = '16px Arial'; ctx.fillStyle = '#ddd';
  const lines = ['Controls:','','Arrow Keys / WASD — Move','Space / W / ↑ — Jump (double jump!)','','Pass checkpoints to save progress.','Avoid spikes, lava, and the void!','You have 3 lives. Good luck!'];
  lines.forEach((l,i) => ctx.fillText(l, canvas.width/2, 248 + i*26));
  let p = 0.65 + Math.sin(Date.now()/320)*0.35;
  ctx.globalAlpha = p; ctx.font = 'bold 30px Arial'; ctx.fillStyle = '#FFD700';
  ctx.fillText('Press SPACE to Start!', canvas.width/2, 466);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawWinScreen() {
  ctx.fillStyle = 'rgba(0,20,0,0.82)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 12;
  for (let p of particles) {
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillRect(p.x - cameraX, p.y, p.r*2, p.r*2);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 86px Arial'; ctx.fillStyle = '#FFD700'; ctx.fillText('YOU WIN!', canvas.width/2, 155);
  ctx.font = 'bold 26px Arial'; ctx.fillStyle = '#fff'; ctx.fillText('Course Completed!', canvas.width/2, 210);
  ctx.font = 'bold 34px Arial'; ctx.fillStyle = '#2ecc71'; ctx.fillText('Time: ' + timer.toFixed(2) + 's', canvas.width/2, 270);
  let grade = timer < 60 ? 'S' : timer < 90 ? 'A' : timer < 130 ? 'B' : 'C';
  let gc = grade==='S'?'#FFD700':grade==='A'?'#2ecc71':grade==='B'?'#3498db':'#e74c3c';
  ctx.font = 'bold 64px Arial'; ctx.fillStyle = gc; ctx.fillText('Grade: ' + grade, canvas.width/2, 355);
  let p2 = 0.65 + Math.sin(Date.now()/320)*0.35;
  ctx.globalAlpha = p2; ctx.font = 'bold 26px Arial'; ctx.fillStyle = '#fff';
  ctx.fillText('Press R to Play Again!', canvas.width/2, 450);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(30,0,0,0.86)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 12;
  ctx.font = 'bold 80px Arial'; ctx.fillStyle = '#e74c3c'; ctx.fillText('GAME OVER', canvas.width/2, 195);
  ctx.font = 'bold 24px Arial'; ctx.fillStyle = '#fff'; ctx.fillText('You ran out of lives!', canvas.width/2, 258);
  ctx.font = '20px Arial'; ctx.fillStyle = '#ddd'; ctx.fillText('Time: ' + timer.toFixed(2) + 's', canvas.width/2, 305);
  let p = 0.65 + Math.sin(Date.now()/320)*0.35;
  ctx.globalAlpha = p; ctx.font = 'bold 30px Arial'; ctx.fillStyle = '#FFD700';
  ctx.fillText('Press R to Try Again!', canvas.width/2, 430);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

buildLevel(); initClouds(); draw();
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(update); });
</script>
</body>
</html>
